name: Online Judge

on:
  workflow_dispatch:  # 手动触发

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ python3
    
    - name: Run judge
      run: |
        cd judge
        python3 judge.py > result.json
        cat result.json
        echo "RESULT_JSON:$(cat result.json)"
    
    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: judge-result
        path: judge/result.json
