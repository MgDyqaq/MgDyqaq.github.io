name: Online Judge

on:
  workflow_dispatch:

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ python3 python3-pip
    
    - name: Install Python dependencies
      run: |
        pip3 install psutil
    
    - name: Run judge
      run: |
        cd judge
        python3 judge.py 2>&1 | tee output.log
        cat output.log | grep "RESULT_JSON:" | sed 's/RESULT_JSON://' > result.json
        cat result.json
